apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-preview
  namespace: camera-shop
  labels:
    app: java-preview
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: java-preview
  template:
    metadata:
      labels:
        app: java-preview
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: java-preview
          image: ghcr.io/hulk1809/camera-java-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres-service:5432/camera_shop_db
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: BOOTSTRAP_ADMIN_ENABLED
              value: "true"
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: java-preview-admin
                  key: email
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: java-preview-admin
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: java-preview-service
  namespace: camera-shop
spec:
  selector:
    app: java-preview
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: java-preview-tls
  namespace: camera-shop
spec:
  secretName: java-preview-ingress-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - java-preview.74.176.156.158.nip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-preview
  namespace: camera-shop
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - java-preview.74.176.156.158.nip.io
      secretName: java-preview-ingress-tls
  rules:
    - host: java-preview.74.176.156.158.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-preview-service
                port:
                  number: 8080
