apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camera-ingress
  namespace: camera-shop
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - progear.74.176.156.158.nip.io
      secretName: camera-ingress-tls
  rules:
    - host: progear.74.176.156.158.nip.io
      http:
        paths:
          # Primary Java Platform (cutover from React/NestJS)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-preview-service
                port:
                  number: 8080
