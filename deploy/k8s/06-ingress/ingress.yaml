apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camera-ingress
  namespace: camera-shop
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000

          # Admin Portal Dashboard
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: web-admin-service
                port:
                  number: 80

          # Customer Web Storefront
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-store-service
                port:
                  number: 3000
