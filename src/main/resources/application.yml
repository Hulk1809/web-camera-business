spring:
  application:
    name: camera-commerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/progear}
    username: ${DB_USER:progear}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
