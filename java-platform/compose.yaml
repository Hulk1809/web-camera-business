services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: camera_platform
      POSTGRES_USER: camera
      POSTGRES_PASSWORD: camera
    volumes:
      - camera-platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camera -d camera_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/camera_platform
      DATABASE_USER: camera
      DATABASE_PASSWORD: camera
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  camera-platform-db:
