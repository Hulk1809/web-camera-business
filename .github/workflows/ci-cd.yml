name: CI/CD Pipeline - Camera E-Commerce to Azure AKS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/hulk1809/camera-backend
  IMAGE_STORE: ghcr.io/hulk1809/camera-store
  IMAGE_ADMIN: ghcr.io/hulk1809/camera-admin
  AKS_CLUSTER_NAME: k8s-hulk-lab

jobs:
  # ----------------------------------------------------------------
  # 1. Build and Push Docker Images
  # ----------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Storefront
      - name: Build and Push Web Storefront
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-store
          file: ./apps/web-store/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_STORE }}:${{ github.sha }}
            ${{ env.IMAGE_STORE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Admin Portal
      - name: Build and Push Web Admin
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-admin
          file: ./apps/web-admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_ADMIN }}:${{ github.sha }}
            ${{ env.IMAGE_ADMIN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # 2. Deploy to Azure Kubernetes Service (k8s-hulk-lab)
  # ----------------------------------------------------------------
  deploy-to-aks:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Kết nối vào cụm AKS bằng Kubeconfig Secret (Cách tối ưu & bảo đảm 100% cho Azure Education)
      - name: Set Kubernetes Context via Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-postgres/
          kubectl apply -f deploy/k8s/02-redis/
          kubectl apply -f deploy/k8s/03-backend/backend.yaml
          kubectl apply -f deploy/k8s/04-web-store/web-store.yaml
          kubectl apply -f deploy/k8s/05-web-admin/web-admin.yaml
          kubectl apply -f deploy/k8s/06-ingress/ingress.yaml

      - name: Rolling Update Deployments with New Images
        run: |
          kubectl set image deployment/backend backend=${{ env.IMAGE_BACKEND }}:${{ github.sha }} -n camera-shop
          kubectl set image deployment/web-store web-store=${{ env.IMAGE_STORE }}:${{ github.sha }} -n camera-shop
          kubectl set image deployment/web-admin web-admin=${{ env.IMAGE_ADMIN }}:${{ github.sha }} -n camera-shop

      - name: Verify Rollout Status (Zero Downtime)
        run: |
          kubectl rollout status deployment/backend -n camera-shop --timeout=180s
          kubectl rollout status deployment/web-store -n camera-shop --timeout=180s
          kubectl rollout status deployment/web-admin -n camera-shop --timeout=180s
