name: CI/CD Pipeline - Camera E-Commerce to Azure AKS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/hulk1809/camera-backend
  IMAGE_STORE: ghcr.io/hulk1809/camera-store
  IMAGE_ADMIN: ghcr.io/hulk1809/camera-admin
  AKS_CLUSTER_NAME: k8s-hulk-lab

jobs:
  # ----------------------------------------------------------------
  # 1. Build and Push Docker Images
  # ----------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Storefront
      - name: Build and Push Web Storefront
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-store
          file: ./apps/web-store/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_STORE }}:${{ github.sha }}
            ${{ env.IMAGE_STORE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Admin Portal
      - name: Build and Push Web Admin
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-admin
          file: ./apps/web-admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_ADMIN }}:${{ github.sha }}
            ${{ env.IMAGE_ADMIN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # 2. Deploy to Azure Kubernetes Service (k8s-hulk-lab)
  # ----------------------------------------------------------------
  deploy-to-aks:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Kết nối vào cụm AKS bằng Kubeconfig Secret (Cách tối ưu & bảo đảm 100% cho Azure Education)
      - name: Set Kubernetes Context via Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG || secrets.KUBECONFIG }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Ensure cert-manager is available
        run: |
          set -euo pipefail

          # Preserve a healthy cert-manager installed outside this workflow. If this
          # workflow owns the release, upgrade --install remains fully idempotent.
          if helm status cert-manager --namespace cert-manager >/dev/null 2>&1; then
            helm upgrade --install cert-manager \
              oci://quay.io/jetstack/charts/cert-manager \
              --version v1.18.2 \
              --namespace cert-manager \
              --create-namespace \
              --set crds.enabled=true \
              --atomic \
              --wait \
              --timeout 5m
          elif kubectl get deployment cert-manager cert-manager-webhook cert-manager-cainjector \
            --namespace cert-manager >/dev/null 2>&1; then
            echo "Using the existing cert-manager installation"
          else
            helm upgrade --install cert-manager \
              oci://quay.io/jetstack/charts/cert-manager \
              --version v1.18.2 \
              --namespace cert-manager \
              --create-namespace \
              --set crds.enabled=true \
              --atomic \
              --wait \
              --timeout 5m
          fi

          kubectl wait --for=condition=Established \
            crd/clusterissuers.cert-manager.io \
            crd/certificates.cert-manager.io \
            --timeout=60s
          kubectl rollout status deployment/cert-manager --namespace cert-manager --timeout=120s
          kubectl rollout status deployment/cert-manager-webhook --namespace cert-manager --timeout=120s
          kubectl rollout status deployment/cert-manager-cainjector --namespace cert-manager --timeout=120s

      - name: Apply Kubernetes Manifests & Deploy
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml

          # Tạo image pull secret cho GHCR
          kubectl create secret docker-registry ghcr-secret \
            --namespace=camera-shop \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # JWT production được quản lý bằng GitHub Secret, không lưu khóa trong Git.
          kubectl create secret generic backend-jwt-secret \
            --namespace=camera-shop \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

          # Áp dụng cơ sở dữ liệu Postgres & Redis
          kubectl apply -f deploy/k8s/01-postgres/
          kubectl apply -f deploy/k8s/02-redis/

          # Thay thế trực tiếp image tag với commit SHA vào manifests
          sed -i "s|ghcr.io/hulk1809/camera-backend:latest|${{ env.IMAGE_BACKEND }}:${{ github.sha }}|g" deploy/k8s/03-backend/backend.yaml
          sed -i "s|ghcr.io/hulk1809/camera-store:latest|${{ env.IMAGE_STORE }}:${{ github.sha }}|g" deploy/k8s/04-web-store/web-store.yaml
          sed -i "s|ghcr.io/hulk1809/camera-admin:latest|${{ env.IMAGE_ADMIN }}:${{ github.sha }}|g" deploy/k8s/05-web-admin/web-admin.yaml

          # Áp dụng manifests (chỉ 1 lần rollout duy nhất)
          kubectl apply -f deploy/k8s/03-backend/backend.yaml
          kubectl apply -f deploy/k8s/04-web-store/web-store.yaml
          kubectl apply -f deploy/k8s/05-web-admin/web-admin.yaml
          # AKS Load Balancer cần probe trực tiếp health endpoint của ingress-nginx;
          # nếu probe path mặc định nhận 404 từ host-only ingress, Azure sẽ chặn toàn bộ traffic.
          kubectl annotate service nginx-ingress-ingress-nginx-controller \
            --namespace=camera-shop \
            service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path=/healthz \
            --overwrite
          kubectl apply -f deploy/k8s/06-ingress/cluster-issuer.yaml
          kubectl apply -f deploy/k8s/06-ingress/certificate.yaml
          kubectl apply -f deploy/k8s/06-ingress/ingress.yaml

      - name: Verify Rollout Status (Zero Downtime)
        run: |
          kubectl rollout status deployment/backend -n camera-shop --timeout=90s || {
            echo "=== BACKEND POD LOGS ==="
            kubectl logs -l app=backend -n camera-shop --tail=100 || true
            echo "=== BACKEND POD DESCRIBE ==="
            kubectl describe pod -l app=backend -n camera-shop || true
            exit 1
          }
          kubectl rollout status deployment/web-store -n camera-shop --timeout=60s
          kubectl rollout status deployment/web-admin -n camera-shop --timeout=60s

          echo "=== INGRESS CONTROLLER & PUBLIC ENDPOINT ==="
          kubectl get svc,ingress -A -o wide

          # Đồng bộ schema trước khi kiểm tra TLS để API mới không phụ thuộc thời gian cấp chứng chỉ.
          echo "=== Synchronizing Prisma schema into database ==="
          kubectl exec deployment/backend -n camera-shop -- npx prisma db push --skip-generate

          # HTTP-01 needs public port 80; the issued certificate is then served on 443.
          kubectl wait --for=condition=Ready certificate/progear-tls \
            -n camera-shop --timeout=5m || {
              echo "=== CERTIFICATE STATUS ==="
              kubectl describe certificate progear-tls -n camera-shop || true
              kubectl get challenges,orders -n camera-shop -o wide || true
              kubectl describe challenges -n camera-shop || true
              kubectl get ingress -A -o yaml || true
              exit 1
            }

          echo "=== Danh sách Pods & Dịch vụ sau khi Deploy Thành Công ==="
          kubectl get pods,svc,ingress,certificate -n camera-shop
