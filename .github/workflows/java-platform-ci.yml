name: Java Platform Shadow CI

on:
  workflow_dispatch:
  pull_request:
    paths: ['java-platform/**', '.github/workflows/java-platform-ci.yml']
  push:
    branches: [main]
    paths: ['java-platform/**', '.github/workflows/java-platform-ci.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: java-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and repository tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Build Vaadin production artifact
        run: mvn --batch-mode --no-transfer-progress -Pproduction -DskipTests package
