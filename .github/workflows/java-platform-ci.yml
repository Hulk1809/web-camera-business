name: Java Platform Shadow CI

on:
  workflow_dispatch:
  pull_request:
    paths: ['java-platform/**', 'qa-java/**', 'deploy/k8s/07-java-preview/**', '.github/workflows/java-platform-ci.yml']
  push:
    branches: [main]
    paths: ['java-platform/**', 'qa-java/**', 'deploy/k8s/07-java-preview/**', '.github/workflows/java-platform-ci.yml']

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: java-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and repository tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Build Vaadin production artifact
        run: mvn --batch-mode --no-transfer-progress -Pproduction -DskipTests package

  ephemeral-browser-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camera
          POSTGRES_PASSWORD: camera-ci-only
          POSTGRES_DB: camera_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camera -d camera_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ephemeral Vaadin artifact
        working-directory: java-platform
        run: mvn --batch-mode --no-transfer-progress -Pproduction -DskipTests package
      - name: Start isolated application
        working-directory: java-platform
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/camera_platform
          DATABASE_USER: camera
          DATABASE_PASSWORD: camera-ci-only
          BOOTSTRAP_SAMPLE_CATALOG_ENABLED: 'true'
          BANK_TRANSFER_ACCOUNT_NUMBER: '0000000000'
          BANK_TRANSFER_ACCOUNT_NAME: 'QA EPHEMERAL ONLY'
        run: |
          set -euo pipefail
          nohup java -jar target/camera-platform-0.1.0-SNAPSHOT.jar > ../ephemeral-app.log 2>&1 &
          echo $! > ../ephemeral-app.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../ephemeral-app.log
          exit 1
      - name: Run authenticated commerce browser lifecycle
        working-directory: qa-java
        env:
          QA_BASE_URL: http://127.0.0.1:8080
          QA_TARGET: java
          QA_EPHEMERAL_WRITES: 'true'
          QA_TIMEOUT_SECONDS: '30'
        run: mvn --batch-mode --no-transfer-progress -Pephemeral-browser test
      - name: Upload ephemeral browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-ephemeral-browser-commerce
          path: |
            qa-java/target/reports/junit/
            qa-java/target/ephemeral-artifacts/
            ephemeral-app.log
          if-no-files-found: warn

  deploy-preview:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Java preview image
        uses: docker/build-push-action@v6
        with:
          context: ./java-platform
          file: ./java-platform/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/hulk1809/camera-java-platform:${{ github.sha }}
            ghcr.io/hulk1809/camera-java-platform:latest
          cache-from: type=gha,scope=java-platform
          cache-to: type=gha,mode=max,scope=java-platform
      - name: Set AKS context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG || secrets.KUBECONFIG }}
      - name: Deploy Java preview
        env:
          PREVIEW_ADMIN_EMAIL: ${{ secrets.JAVA_PREVIEW_ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.JAVA_PREVIEW_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_ADMIN_EMAIL"
          test ${#PREVIEW_ADMIN_PASSWORD} -ge 12
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl create secret docker-registry ghcr-secret \
            --namespace=camera-shop \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic java-preview-admin \
            --namespace=camera-shop \
            --from-literal=email="$PREVIEW_ADMIN_EMAIL" \
            --from-literal=password="$PREVIEW_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic java-preview-bank-transfer \
            --namespace=camera-shop \
            --from-literal=account-number="${{ secrets.BANK_TRANSFER_ACCOUNT_NUMBER }}" \
            --from-literal=account-name="${{ secrets.BANK_TRANSFER_ACCOUNT_NAME }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|ghcr.io/hulk1809/camera-java-platform:latest|ghcr.io/hulk1809/camera-java-platform:${{ github.sha }}|" \
            deploy/k8s/07-java-preview/java-preview.yaml
          kubectl apply -f deploy/k8s/07-java-preview/java-preview.yaml
          kubectl rollout status deployment/java-preview -n camera-shop --timeout=5m
          kubectl wait --for=condition=Ready certificate/java-preview-tls -n camera-shop --timeout=5m
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            https://java-preview.74.176.156.158.nip.io/actuator/health
