name: Deploy Java Platform to AWS EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag; defaults to the selected commit SHA
        required: false
        type: string
  workflow_run:
    workflows: ['Java Platform Shadow CI']
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: aws-java-platform
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_HOST: ${{ vars.AWS_EC2_HOST }}
      AWS_USER: ${{ vars.AWS_EC2_USER }}
      DEPLOY_DIR: /home/ec2-user/progear-java
      IMAGE_REPOSITORY: ghcr.io/hulk1809/camera-java-platform
      POSTGRES_PASSWORD: ${{ secrets.AWS_POSTGRES_PASSWORD }}
      JAVA_ADMIN_EMAIL: ${{ secrets.JAVA_PREVIEW_ADMIN_EMAIL }}
      JAVA_ADMIN_PASSWORD: ${{ secrets.JAVA_PREVIEW_ADMIN_PASSWORD }}
      BANK_ACCOUNT_NUMBER: ${{ secrets.BANK_TRANSFER_ACCOUNT_NUMBER }}
      BANK_ACCOUNT_NAME: ${{ secrets.BANK_TRANSFER_ACCOUNT_NAME }}
      QA_FIXTURE_TOKEN: ${{ secrets.AWS_QA_FIXTURE_TOKEN }}
    steps:
      - name: Resolve deployment revision
        id: revision
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
          elif [ -n "${WORKFLOW_SHA:-}" ]; then
            tag="$WORKFLOW_SHA"
          else
            tag="${GITHUB_SHA}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_HOST"
          test -n "$AWS_USER"
          test -n "$POSTGRES_PASSWORD"
          test -n "$JAVA_ADMIN_EMAIL"
          test ${#JAVA_ADMIN_PASSWORD} -ge 12
          test -n "$BANK_ACCOUNT_NUMBER"
          test -n "$BANK_ACCOUNT_NAME"
          test ${#QA_FIXTURE_TOKEN} -ge 32

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aws-ec2
          chmod 600 ~/.ssh/aws-ec2
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare runtime environment
        env:
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/progear-aws
          {
            printf 'POSTGRES_USER=%s\n' 'camera'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' 'camera_platform'
            printf 'JAVA_ADMIN_EMAIL=%s\n' "$JAVA_ADMIN_EMAIL"
            printf 'JAVA_ADMIN_PASSWORD=%s\n' "$JAVA_ADMIN_PASSWORD"
            printf 'BANK_TRANSFER_ACCOUNT_NUMBER=%s\n' "$BANK_ACCOUNT_NUMBER"
            printf 'BANK_TRANSFER_ACCOUNT_NAME=%s\n' "$BANK_ACCOUNT_NAME"
            printf 'QA_FIXTURE_ENABLED=%s\n' 'true'
            printf 'QA_FIXTURE_TOKEN=%s\n' "$QA_FIXTURE_TOKEN"
            printf 'PUBLIC_PORT=%s\n' '8090'
            printf 'PUBLIC_HOSTNAME=%s\n' 'java-aws.54.179.55.104.nip.io'
            printf 'JAVA_IMAGE=%s:%s\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG"
          } > /tmp/progear-aws/.env
          chmod 600 /tmp/progear-aws/.env
          cp deploy/aws/docker-compose.yml /tmp/progear-aws/docker-compose.yml
          cp deploy/aws/deploy.sh /tmp/progear-aws/deploy.sh
          chmod 700 /tmp/progear-aws/deploy.sh

      - name: Upload AWS Compose stack
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aws-ec2 "$AWS_USER@$AWS_HOST" "mkdir -p '$DEPLOY_DIR' && chmod 700 '$DEPLOY_DIR'"
          scp -i ~/.ssh/aws-ec2 /tmp/progear-aws/docker-compose.yml /tmp/progear-aws/deploy.sh \
            /tmp/progear-aws/.env \
            "$AWS_USER@$AWS_HOST:$DEPLOY_DIR/"

      - name: Authenticate EC2 to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/aws-ec2 "$AWS_USER@$AWS_HOST" \
            "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy and verify
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aws-ec2 "$AWS_USER@$AWS_HOST" \
            "'$DEPLOY_DIR/deploy.sh' '$DEPLOY_DIR'"

      - name: Verify public HTTPS
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location \
              https://java-aws.54.179.55.104.nip.io/actuator/health/readiness | grep -q UP; then
              echo 'AWS public HTTPS check passed'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify public HTTP redirects to HTTPS
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header - \
            http://java-aws.54.179.55.104.nip.io/)"
          printf '%s' "$headers" | grep -Eq '^HTTP/[0-9.]+ 30[1278]'
          printf '%s' "$headers" | grep -Eiq '^location: https://java-aws\.54\.179\.55\.104\.nip\.io/'

      - name: Deployment diagnostics
        if: failure()
        run: |
          ssh -i ~/.ssh/aws-ec2 "$AWS_USER@$AWS_HOST" \
            "cd '$DEPLOY_DIR' && sudo docker compose ps && sudo docker ps --format 'table {{.Names}}\\t{{.Image}}\\t{{.Ports}}' && sudo docker compose logs --tail=100" || true
