name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: ci-only-not-a-production-secret
      COMPOSE_PROJECT_NAME: progear-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 .
      - name: Start stack
        run: docker compose up --build --wait
      - name: Verify PostgreSQL health
        run: test "$(docker inspect --format '{{.State.Health.Status}}' progear-ci-postgres-1)" = healthy
      - name: Verify Flyway migration
        run: test "$(docker compose exec -T postgres psql -U progear -d progear -Atc \"select version || ':' || success from flyway_schema_history where version = '1'\")" = "1:true"
      - name: Verify public health
        run: curl --fail --silent http://localhost:8080/actuator/health | grep --fixed-strings '"status":"UP"'
      - name: Verify anonymous root protection
        run: |
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/)"
          test "$code" = 302 || test "$code" = 401 || test "$code" = 403
      - name: Verify non-root image
        run: test "$(docker image inspect --format '{{.Config.User}}' progear-ci-app)" = app
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
