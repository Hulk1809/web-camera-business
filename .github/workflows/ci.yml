name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure Docker API for Testcontainers
        run: echo 'api.version=1.44' > ~/.docker-java.properties
      - run: mvn --batch-mode verify

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: ci-only-not-a-production-secret
      COMPOSE_PROJECT_NAME: progear-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 .
      - name: Start stack
        run: docker compose up --build --wait
      - name: Verify PostgreSQL health
        run: test "$(docker inspect --format '{{.State.Health.Status}}' progear-ci-postgres-1)" = healthy
      - name: Verify Flyway migration
        run: |
          result="$(docker compose exec -T postgres psql -U progear -d progear -Atc "select version || ':' || success from flyway_schema_history where version = '1'")"
          test "$result" = "1:true"
      - name: Verify public health
        run: curl --fail --silent http://localhost:8080/actuator/health | grep --fixed-strings '"status":"UP"'
      - name: Verify anonymous root protection
        run: |
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/)"
          test "$code" = 302 || test "$code" = 401 || test "$code" = 403
      - name: Verify non-root image
        run: test "$(docker image inspect --format '{{.Config.User}}' progear-ci-app)" = app
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Block committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      - name: Build commit image and record digest
        id: build
        run: |
          docker buildx build --load --tag camera-commerce:${{ github.sha }} --metadata-file image-metadata.json .
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' image-metadata.json > image-digest.txt
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: camera-commerce:${{ github.sha }}
          format: cyclonedx
          output: image-sbom.cdx.json
      - name: Block critical application dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: camera-commerce:${{ github.sha }}
          scanners: vuln
          vuln-type: library
          severity: CRITICAL
          exit-code: '1'
      - name: Block critical image vulnerabilities
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: camera-commerce:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ github.sha }}
          path: |
            image-sbom.cdx.json
            image-digest.txt
            image-metadata.json
          if-no-files-found: warn
